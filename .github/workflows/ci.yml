name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x hccs hccs-proxy.lib install.sh hccs-attribution-hook
      - name: python compile
        run: python3 -m py_compile hccs-dashboard.py
